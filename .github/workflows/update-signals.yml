name: Update signals

on:
  schedule:
    # Daily: Mon-Fri 22:30 UTC = 17:30/18:30 ET, after the US futures settlement and option-chain snapshot.
    - cron: "30 22 * * 1-5"
    # Weekly: Friday 21:00 UTC = 16:00/17:00 ET, after the CFTC COT release (15:30 ET).
    - cron: "0 21 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or weekly"
        required: false
        default: "daily"

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install -e ./engine

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 * * 5" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run engine
        run: python -m macrovol.cli run --mode "${{ steps.mode.outputs.mode }}" --cache-hours 0

      - name: Commit snapshot
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data/latest.json data/timeline.json data/history
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
